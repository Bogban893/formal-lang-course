name: Run tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-tests
  cancel-in-progress: true

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Install rye
        uses: eifinger/setup-rye@v4
        with:
          enable-cache: true

      - name: Sync dependencies
        run: rye sync

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate parser
        run: |
          rye run python -c 'import antlerinator, subprocess; subprocess.run(["java", "-jar", str(antlerinator.download(version="4.13.1", lazy=True)), "-Dlanguage=Python3", "-visitor", "-Xexact-output-dir", "-o", "project/generated", "project/grammar/GraphQuery.g4"], check=True)'

      - name: Run tests
        run: rye run python scripts/run_tests.py
